<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support Ticket Classifier</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 90px; padding: 8px; font-size: 15px; }
    button { margin-top: 8px; padding: 8px 18px; font-size: 15px; cursor: pointer; }
    .result { margin-top: 16px; padding: 10px; background: #e8f5e9; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Support Ticket Classifier</h1>
  <form method="POST">
    <textarea name="text" placeholder="Type a support ticket, e.g. My card was charged twice"></textarea>
    <button type="submit">Classify</button>
  </form>

  {% if result %}
    <div class="result">Predicted category: <b>{{ result }}</b></div>
  {% endif %}

  <h2>History</h2>
  <table>
    <tr><th>#</th><th>Ticket</th><th>Category</th><th>Time</th></tr>
    {% for row in history %}
    <tr><td>{{ row["id"] }}</td><td>{{ row["text"] }}</td><td>{{ row["category"] }}</td><td>{{ row["created_at"] }}</td></tr>
    {% endfor %}
  </table>
</body>
</html>
